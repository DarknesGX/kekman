  body {
    margin: 0;

    background: #000;
    color: #0f0;
    font-family: monospace;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  img {
    width: 200px;
    animation: pulse 2s infinite alternate;
  }
  @keyframes pulse {
    from { opacity: .8; transform: scale(1); }
    to   { opacity: 1;  transform: scale(1.05); }
  }
  .txt {
    position: absolute;
    color: #f0f;
    font-size: 13px;
    white-space: nowrap;
    animation: flicker 1.8s infinite alternate;
    pointer-events: none;
  }
  @keyframes flicker {
    0% { opacity: .2; }
    50% { opacity: 1; }
    100% { opacity: .5; }
  }
</style>
</head>
<body>
